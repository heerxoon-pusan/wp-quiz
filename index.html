<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>워드프로세서 오늘의 학습 (신중 풀이)</title>
<meta name="description" content="워드프로세서 필기 이론 개념 학습 - 새 문제 첫 시도 정답 + 재도전 방식">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📝%3C/text%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#101828; --muted:#5B6676; --line:#D5DCE4;
  --ok:#12805C; --okbg:#E4F5EE; --bad:#B42318; --badbg:#FDECEA;
  --s1:#0F766E; --s2:#4338CA; --s3:#B45309; --btn:#101828; --btnink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
    --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
    --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
  --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
  --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc,var(--ink));outline-offset:2px}
.s1{--acc:var(--s1)}.s2{--acc:var(--s2)}.s3{--acc:var(--s3)}

h1{font-size:1.5rem;font-weight:900;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.who b{font-weight:700}
.link{background:none;border:0;padding:6px 4px;color:var(--muted);text-decoration:underline;font-size:.85rem}

.field{display:flex;gap:8px;margin:12px 0 4px}
.field input{flex:1;min-width:0;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:14px 20px;font-weight:700;min-height:48px}
.btn.wide{width:100%;margin-top:16px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.subjects{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--acc);border-radius:14px;padding:16px 16px 14px}
.card .n{font-weight:900;font-size:1.15rem;color:var(--acc)}
.card .t{font-weight:700;margin:2px 0 6px}
.card .m{font-size:.85rem;color:var(--muted)}
.card.done{background:var(--okbg)}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--surface);margin-top:8px}
.redo{margin-top:4px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chip{font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1.5px solid var(--acc);color:var(--acc)}
.count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.topic{font-size:.85rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hot{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--surface)}
.q{font-size:1.2rem;font-weight:700;line-height:1.5;margin:0 0 18px;letter-spacing:-.01em;word-break:keep-all}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;min-height:54px;word-break:keep-all;position:relative;transition:background-color .25s,border-color .25s,opacity .3s,transform .15s;animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*65ms + 140ms)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.choice.ox{justify-content:center;align-items:center;font-weight:700;font-size:1.05rem}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb p{margin:0;font-size:.95rem}
.fb .src{margin-top:6px;font-size:.8rem;color:var(--muted)}

.cert{background:var(--surface);border:2px solid var(--acc);border-radius:18px;padding:22px 18px;text-align:center}
.cert .h{font-weight:700;color:var(--acc);font-size:1rem}
.cert .name{font-size:2.1rem;font-weight:900;margin:8px 0 2px;letter-spacing:-.02em}
.cert .subj{color:var(--muted);margin-bottom:14px}
.cert .score{font-size:3.4rem;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.cert .score small{font-size:1.2rem;font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats div{border:1.5px solid var(--line);border-radius:12px;padding:8px}
.stats span{display:block;font-size:.78rem;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.clock{border:1.5px dashed var(--acc);border-radius:14px;padding:12px 8px;margin-top:6px}
.clock span{display:block;font-size:.78rem;color:var(--muted)}
.clock b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:.9rem;font-weight:500;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.code{margin-top:12px;font-size:.85rem;color:var(--muted)}
.code b{color:var(--ink);letter-spacing:.12em}
.actions{display:grid;gap:8px;margin-top:16px}

/* ---------- 애니메이션 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes leaveL{to{opacity:0;transform:translateX(-34px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-5px)}78%{transform:translateX(3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes kpop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes bump{40%{transform:scale(1.4);color:var(--acc)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes certIn{from{opacity:0;transform:scale(.86) translateY(24px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.qwrap{animation:enterR .38s cubic-bezier(.2,.7,.2,1) backwards}
.qwrap.leave{animation:leaveL .22s ease-in forwards;pointer-events:none}
.q{animation:rise .5s .05s cubic-bezier(.2,.7,.2,1) backwards}
.choice:active:not(:disabled){transform:scale(.985)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--acc)}.card:hover{transform:translateY(-2px)}}
.card{transition:transform .2s,border-color .2s}
.card:active{transform:scale(.99)}
.choice.ok.picked{animation:pop .5s cubic-bezier(.3,1.5,.5,1),ring .8s ease-out}
.choice.bad.picked{animation:shake .5s}
.choice.ok.late{transition-delay:.3s;animation:ring .9s .3s ease-out}
.choice.ok .k,.choice.bad .k{animation:kpop .4s .05s cubic-bezier(.3,1.6,.5,1) backwards}
.choice.ok.late .k{animation-delay:.35s}
.count.bump{animation:bump .5s}
.fb{animation:rise .42s .05s cubic-bezier(.2,.7,.2,1) backwards}
.nx{animation:rise .42s .2s cubic-bezier(.2,.7,.2,1) backwards}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fp{position:absolute;display:block;will-change:transform,opacity}
.cert{animation:certIn .7s cubic-bezier(.2,1.15,.3,1) backwards}
.chk{width:68px;height:68px;display:block;margin:0 auto 6px;fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chk circle{stroke-dasharray:145;stroke-dashoffset:145;animation:draw .7s .15s ease-out forwards}
.chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .75s ease-out forwards}
.stats div{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--j,0)*80ms + 650ms)}
.clock{animation:rise .5s 1.05s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chk circle,.chk path{stroke-dashoffset:0}
}

/* ---------- 신중 풀이 버전 추가 스타일 ---------- */
.stat{margin:0 0 10px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.stat b{display:inline-block}
.stat .dim2{color:var(--muted);font-weight:500;margin:0 2px}
.stat b.bump{animation:bump .5s}
.retry{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad)}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bad);background:var(--badbg);font-size:.92rem;animation:rise .42s .02s cubic-bezier(.2,.7,.2,1) backwards}
.notice b{color:var(--bad)}
.fb .part{margin-top:12px}
.fb .part i{display:block;font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.fb .part p{word-break:keep-all}
.fb b.ans{display:block;margin-bottom:2px;color:var(--ok)}
.fb .tip{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line)}
.intro .msg{font-size:1.15rem;font-weight:700;margin:10px 0 4px;word-break:keep-all;line-height:1.6}
.intro .stats{margin-bottom:4px}
</style>
</head>

/*ENGINE_START*/
/* ---------- 신중 풀이 엔진 (화면과 무관한 순수 로직) ---------- */
const TARGET = 20;                        // 새 문제 첫 시도 정답 목표 수
const PENALTY_ON_RETRY_WRONG = false;     // true로 바꾸면 재도전 오답 시 추가 규칙을 넣을 수 있는 확장 훅(현재 미사용)

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function targetFor(s){ return Math.min(TARGET, BANK[s].length); }

/* 새 문제 뽑기: 이번 세션에 나온 문제 제외 → 단원 비율 유지 → 예전에 안 푼 문제 우선 */
function drawNew(s, k, seenSession, hist){
  const bank = BANK[s];
  if(k <= 0) return [];
  const cand = bank.filter(q => !seenSession.has(q.id));
  if(cand.length === 0) return [];
  k = Math.min(k, cand.length);
  const share = {};
  bank.forEach(q => { share[q.t] = (share[q.t] || 0) + 1; });
  const quotas = Object.keys(share).map(t => { const x = k*share[t]/bank.length; return {t, n:Math.floor(x), r:x-Math.floor(x)}; });
  const left = k - quotas.reduce((a,x) => a + x.n, 0);
  quotas.slice().sort((a,b) => b.r - a.r).slice(0, left).forEach(x => x.n++);
  const byT = {};
  cand.forEach(q => (byT[q.t] = byT[q.t] || []).push(q));
  const prefer = arr => { const a = shuffle(arr); return a.filter(q => !hist.has(q.id)).concat(a.filter(q => hist.has(q.id))); };
  const chosen = [];
  quotas.forEach(x => chosen.push(...prefer(byT[x.t] || []).slice(0, x.n)));
  if(chosen.length < k){                       // 단원별 재고가 모자라면 남은 문제로 채움
    const ids = new Set(chosen.map(q => q.id));
    chosen.push(...prefer(cand.filter(q => !ids.has(q.id))).slice(0, k - chosen.length));
  }
  const out = shuffle(chosen).slice(0, k).map(q => q.id);
  out.forEach(id => hist.add(id));
  if(hist.size >= bank.length){ hist.clear(); out.forEach(id => hist.add(id)); }   // 문제은행 소진 → 기록 초기화(예전 문제로 채움)
  return out;
}

function newRun(s, name, date, hist){
  const run = {v:2, subj:s, name, date, target:targetFor(s), phase:'new',
    firstCorrect:0, retryQueue:[], seen:[], batch:[], batchNo:0,
    shown:0, newShown:0, firstWrong:0, retryShown:0, retryWrong:0, correctCount:0,
    retryStart:0, pendingIntro:false, ms:0};
  run.batch = drawNew(s, run.target, new Set(), hist);
  run.seen = run.batch.slice();
  if(run.batch.length === 0) run.phase = 'done';
  return run;
}

function currentId(run){ return run.phase === 'new' ? run.batch[0] : (run.phase === 'retry' ? run.retryQueue[0] : undefined); }

/* 답 제출: run을 직접 갱신하고 결과 정보를 돌려준다. skip=true면 집계 없이 문제만 넘긴다(문제은행 교체 대비). */
function submit(run, right, hist, skip){
  const info = {phase:run.phase, right:!!right, toRetry:false, done:false, exhausted:false};
  if(run.phase === 'new'){
    const id = run.batch.shift();
    if(!skip){
      run.shown++; run.newShown++;
      if(right){ run.firstCorrect++; run.correctCount++; }
      else { run.firstWrong++; run.retryQueue.push(id); }
    }
    if(run.batch.length === 0){
      if(run.firstCorrect < run.target){
        const more = drawNew(run.subj, run.target - run.firstCorrect, new Set(run.seen), hist);
        if(more.length === 0){ run.target = run.firstCorrect; info.exhausted = true; }   // 은행 소진 예외: 목표를 현재 정답 수로 낮춤
        else { run.batch = more; run.seen.push(...more); run.batchNo++; }
      }
      if(run.batch.length === 0){
        if(run.retryQueue.length){ run.phase = 'retry'; run.retryStart = run.retryQueue.length; run.pendingIntro = true; info.toRetry = true; }
        else { run.phase = 'done'; info.done = true; }
      }
    }
  } else if(run.phase === 'retry'){
    const id = run.retryQueue.shift();
    if(!skip){
      run.shown++; run.retryShown++;
      if(right){ run.correctCount++; }
      else {
        run.retryWrong++; run.retryQueue.push(id);      // 오답이면 큐 맨 뒤로, 새 문제는 추가하지 않음
        if(PENALTY_ON_RETRY_WRONG){ /* 확장 훅: 벌칙 규칙을 넣을 자리 */ }
      }
    }
    if(run.retryQueue.length === 0){ run.phase = 'done'; info.done = true; }
  }
  return info;
}
/*ENGINE_END*/

const SUBJ = {
  1: {name:'1과목', title:'워드프로세싱 용어 및 기능'},

};
const DAYS = ['일','월','화','수','목','금','토'];

/* ---------- 저장소 (막히면 메모리로 대체) ---------- */
const mem = {};
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return (k in mem) ? mem[k] : d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ mem[k] = v; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){ delete mem[k]; } }
};

const app = document.getElementById('app');
let name = store.get('wp_name', '');
let cur = null;          // 현재 문제 {id, q, order, answered}
let t0 = 0;
let clockTimer = null;

/* ---------- 유틸 ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
function todayKey(d = new Date()){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(d){ return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate())+' ('+DAYS[d.getDay()]+')'; }
function fmtTime(d){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); }
function fmtDur(ms){ const s = Math.round(ms/1000); return Math.floor(s/60)+'분 '+pad(s%60)+'초'; }
function hash4(str){ let h = 2166136261; for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,16777619); } return (h>>>0).toString(36).toUpperCase().padStart(4,'0').slice(-4); }
const byId = (s, id) => BANK[s].find(q => q.id === id);

/* ---------- 상태 저장 ---------- */
function getHist(s){ return new Set(store.get('wp2_seen_'+s, [])); }
function saveHist(s, h){ store.set('wp2_seen_'+s, [...h]); }
function getRun(){ const r = store.get('wp2_run', null); return (r && r.v === 2) ? r : null; }
function setRun(r){ r ? store.set('wp2_run', r) : store.del('wp2_run'); }
function getDone(){
  const all = store.get('wp2_done', {});
  const keep = {}; const cutoff = Date.now() - 14*86400000;
  Object.keys(all).forEach(k => { if(new Date(k).getTime() >= cutoff) keep[k] = all[k]; });
  return keep;
}
function doneToday(s){ const d = getDone()[todayKey()]; return d && d[s] && d[s].name === name ? d[s] : null; }

function startRun(s){
  const hist = getHist(s);
  const run = newRun(s, name, todayKey(), hist);
  saveHist(s, hist);
  setRun(run);
  showQuestion();
}
const statusText = run => '새 문제 정답 '+run.firstCorrect+'/'+run.target+' · 재도전 대기 '+run.retryQueue.length;

/* ---------- 효과 ---------- */
const RM = (typeof matchMedia === 'function') && matchMedia('(prefers-reduced-motion: reduce)').matches;
function fxLayer(){
  let l = document.getElementById('fx');
  if(!l){ l = document.createElement('div'); l.id = 'fx'; l.className = 'fx'; document.body.appendChild(l); }
  return l;
}
function burst(x, y, opt){
  if(RM) return;
  try{
    const layer = fxLayer();
    const o = Object.assign({n:12, spread:70, size:8, fall:0, colors:['var(--ok)','var(--acc)'], dur:750}, opt || {});
    for(let i = 0; i < o.n; i++){
      const p = document.createElement('i');
      p.className = 'fp';
      const w = o.size * (0.6 + Math.random()*0.8);
      const h = Math.random() < .5 ? w : w*0.45;
      p.style.cssText = 'left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px;background:'+o.colors[i % o.colors.length]+';border-radius:'+(Math.random() < .4 ? '50%' : '2px');
      layer.appendChild(p);
      const a = Math.random()*Math.PI*2, d = o.spread*(0.4 + Math.random()*0.6);
      const dx = Math.cos(a)*d, dy = Math.sin(a)*d - o.spread*0.25;
      const r = (Math.random() - .5)*540;
      const an = p.animate([
        {transform:'translate(0,0) scale(.4) rotate(0deg)', opacity:1},
        {transform:'translate('+dx+'px,'+dy+'px) scale(1) rotate('+(r*0.6)+'deg)', opacity:1, offset:.55},
        {transform:'translate('+(dx*1.1)+'px,'+(dy + o.fall)+'px) scale(.8) rotate('+r+'deg)', opacity:0}
      ], {duration:o.dur*(0.8 + Math.random()*0.5), easing:'cubic-bezier(.16,.7,.3,1)', fill:'forwards'});
      an.onfinish = () => p.remove();
    }
  }catch(e){}
}
function celebrate(){
  if(RM) return;
  try{
    const w = window.innerWidth, h = window.innerHeight;
    const cols = ['var(--acc)','var(--ok)','#F59E0B','#EC4899','#3B82F6'];
    [[.18,.38],[.5,.3],[.82,.38]].forEach((pt, i) => setTimeout(() => burst(w*pt[0], h*pt[1], {n:28, spread:150, size:10, fall:280, colors:cols, dur:1500}), 300 + i*180));
  }catch(e){}
}

/* ---------- 화면: 홈 ---------- */
function stopClock(){ if(clockTimer){ clearInterval(clockTimer); clockTimer = null; } }
function home(){

    if(d){ status = `<div class="m">오늘 학습 완료 · ${fmtDur(d.ms)}</div><span class="badge">✓ 오늘 완료</span>`; }
    else if(resume){ status = `<div class="m">풀던 문제 · ${statusText(run)}${run.phase==='retry'?' · 재도전 중':''}</div>`; }
    cards += `<div class="rise" style="--i:${s+2}"><button class="card s${s} ${d?'done':''}" data-s="${s}" data-act="${d?'cert':(resume?'resume':'new')}">
      <div class="n">${SUBJ[s].name}</div><div class="t">${SUBJ[s].title}</div>${status}</button>
      ${ (resume && !d) ? `<button class="link redo" data-s="${s}" data-act="new">새 문제로 다시 시작</button>` : '' }
      ${ d ? `<button class="link redo" data-s="${s}" data-act="new">한 번 더 풀기</button>` : '' }</div>`;
  });
  app.innerHTML = `
    <div class="who rise" style="--i:0"><span><b>${esc(name)}</b>님, 오늘 학습할 과목을 고르세요.</span><button class="link" id="chg">이름 변경</button></div>
    <h1 class="rise" style="--i:1">오늘의 학습</h1>
    <p class="sub rise" style="--i:2">매번 문제와 보기 순서가 달라집니다. 새 문제를 첫 시도에 모두 맞히고, 틀린 문제까지 다시 맞히면 학습이 끝납니다.</p>
    <div class="subjects">${cards}</div>`;
  document.getElementById('chg').onclick = () => { name = ''; store.del('wp_name'); home(); };
  app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const s = +b.dataset.s, act = b.dataset.act;
    if(act === 'cert') return certificate(s, doneToday(s), false);
    if(act === 'resume') return showQuestion();
    startRun(s);
  });
}

/* ---------- 화면: 문제 ---------- */
function goNext(){
  const w = (typeof document.querySelector === 'function') ? document.querySelector('.qwrap') : null;
  if(!w || RM){ showQuestion(); return; }
  w.classList.add('leave');
  setTimeout(showQuestion, 230);
}

function barPct(run){
  if(run.phase === 'retry' && run.retryStart > 0) return Math.round((1 - run.retryQueue.length / Math.max(run.retryStart, run.retryQueue.length)) * 100);
  return run.target ? Math.round(run.firstCorrect / run.target * 100) : 100;
}

function showQuestion(){
  stopClock();
  const run = getRun();
  if(!run) return home();
  if(run.phase === 'done') return finish(run);
  if(run.pendingIntro) return showIntro(run);
  const s = run.subj;
  const id = currentId(run);
  const q = byId(s, id);
  if(!q){                                     // 문제은행이 바뀌어 없는 문제 → 집계 없이 넘김
    const hist = getHist(s); submit(run, false, hist, true); saveHist(s, hist); setRun(run);
    return showQuestion();
  }
  const isOX = q.c.length === 2;
  const order = isOX ? [0,1] : shuffle(q.c.map((_,i)=>i));      // 보기 순서는 매번 다시 섞음(재도전 포함)
  cur = {id, q, order, answered:false};
  t0 = Date.now();
  const retry = run.phase === 'retry';
  const choices = order.map((oi, pos) => isOX
    ? `<button class="choice ox" style="--i:${pos}" data-pos="${pos}">${oi===0?'○ 맞다':'✕ 틀리다'}</button>`
    : `<button class="choice" style="--i:${pos}" data-pos="${pos}"><span class="k">${pos+1}</span><span>${esc(q.c[oi])}</span></button>`).join('');
  app.innerHTML = `
    <div class="s${s} qwrap">
      <div class="top"><button class="link" id="pause">홈으로</button><span class="chip">${SUBJ[s].name}</span></div>
      <div class="stat" aria-live="polite">새 문제 정답 <b id="fc">${run.firstCorrect}</b>/${run.target} <span class="dim2">·</span> 재도전 대기 <b id="rq">${run.retryQueue.length}</b></div>
      <div class="bar"><i style="width:${barPct(run)}%"></i></div>
      <div class="topic"><span>${esc(q.t)}</span>${retry?'<span class="retry">재도전</span>':''}${q.h?'<span class="hot">기출 반복</span>':''}</div>
      <h2 class="q">${esc(q.q)}</h2>
      <div class="choices">${choices}</div>
      <div id="fb"></div>
    </div>`;
  document.getElementById('pause').onclick = home;
  app.querySelectorAll('.choice').forEach(b => b.onclick = () => answer(+b.dataset.pos));
  if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
}

function bumpEl(el, v){ if(!el) return; el.textContent = v; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function answer(pos){
  if(!cur || cur.answered) return;
  cur.answered = true;
  const run = getRun();
  const {q, order} = cur;
  const chosenIdx = order[pos];
  const right = chosenIdx === q.a;
  const hist = getHist(run.subj);
  run.ms += Math.min(Date.now() - t0, 120000);
  const info = submit(run, right, hist);
  saveHist(run.subj, hist);
  setRun(run);

  const btns = app.querySelectorAll('.choice');
  btns.forEach((b,i) => {
    b.disabled = true;
    const k = b.querySelector('.k');
    if(i === pos){ b.classList.add('picked', right ? 'ok' : 'bad'); if(k) k.textContent = right ? '✓' : '✕'; }
    else if(order[i] === q.a){ b.classList.add('ok', 'late'); if(k) k.textContent = '✓'; }
    else b.classList.add('dim');
  });
  const bi = app.querySelector('.bar i');
  if(bi) bi.style.width = barPct(run) + '%';
  bumpEl(document.getElementById('rq'), run.retryQueue.length);
  if(right && info.phase === 'new') bumpEl(document.getElementById('fc'), run.firstCorrect);
  if(right){
    const pk = btns[pos];
    if(pk){ const t = pk.querySelector('.k') || pk; const r = t.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, {n:14, spread:75, size:8}); }
  }

  const tip = q.tip ? `<div class="tip">💡 ${esc(q.tip)}</div>` : '';
  let html = '';
  if(right){
    html = `<div class="fb ok" role="status"><b>${info.phase==='retry' ? '정답입니다 · 재도전 성공' : '정답입니다'}</b><p>${esc(q.e)}</p>${tip}</div>`;
  } else {
    const need = run.target - run.firstCorrect;
    const banner = info.phase === 'new'
      ? `<div class="notice" role="status"><b>틀린 문제는 나중에 다시 풀어야 합니다.</b> 통과하려면 새 문제 ${run.target}개를 첫 시도에 맞혀야 하니 신중하게 풀어보세요.${need>0?` (필요한 새 문제: 앞으로 ${need}개)`:''}</div>`
      : `<div class="notice" role="status"><b>다시 틀렸습니다.</b> 이 문제는 재도전 대기열 맨 뒤로 갑니다. 재도전을 모두 맞혀야 학습이 끝납니다.</div>`;
    const why = q.w && q.w[chosenIdx] ? q.w[chosenIdx] : '정답이 아닙니다.';
    html = banner + `
      <div class="fb bad" role="status">
        <b>${info.phase==='new' ? '오답입니다 · 재도전 단계에서 다시 나옵니다' : '오답입니다'}</b>
        <div class="part"><i>① 내가 고른 보기가 틀린 이유</i><p>“${esc(q.c[chosenIdx])}”<br>${esc(why)}</p></div>
        <div class="part"><i>② 정답 해설</i><p><b class="ans">정답: ${esc(q.c[q.a])}</b>${esc(q.e)}</p></div>
        <div class="part"><i>③ 풀이 팁</i><p>${esc(q.tip || '')}</p></div>
        <div class="part"><i>④ 이론 수정판 위치</i><p>${esc(q.p)}</p></div>
      </div>`;
  }
  const label = info.done ? '결과 보기' : (info.toRetry ? '재도전으로 넘어가기' : '다음 문제');
  document.getElementById('fb').innerHTML = html + `<button class="btn wide nx" id="next">${label}</button>`;
  const nb = document.getElementById('next');
  nb.onclick = goNext;
  nb.focus({preventScroll:true});
  if(nb.scrollIntoView) nb.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
}

/* ---------- 화면: 새 문제 통과 → 재도전 전환 안내 ---------- */

        <div class="stats">

/* ---------- 완료 ---------- */
function finish(run){
  const s = run.subj;
  const at = Date.now();
  const rec = {name, ms:run.ms, target:run.target, shown:run.shown, firstWrong:run.firstWrong, retries:run.retryShown, at,
    code: hash4(name+'|'+todayKey()+'|'+s+'|'+at)};
  const all = getDone();
  const k = todayKey();
  all[k] = all[k] || {};
  all[k][s] = rec;
  store.set('wp2_done', all);
  setRun(null);
  certificate(s, rec, true);
}

function certificate(s, rec, fresh){
  stopClock();
  const at = new Date(rec.at);
  const T = rec.target;
  app.innerHTML = `
    <div class="s${s}">
      <div class="cert">
        <svg class="chk" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="23"/><path d="M15 27l8 8 15-16"/></svg>
        <div class="h">오늘 학습 완료</div>
        <div class="name">${esc(rec.name)}</div>
        <div class="subj">${SUBJ[s].name} · ${SUBJ[s].title}</div>
        <div class="score"><span id="sc">${T}</span><small> / ${T} 새 문제 첫 시도 정답</small></div>
        <div class="stats">
          <div style="--j:0"><span>완료 일시</span><b>${fmtDate(at)}<br>${fmtTime(at)}</b></div>
          <div style="--j:1"><span>소요 시간</span><b>${fmtDur(rec.ms)}</b></div>
          <div style="--j:2"><span>총 출제 수</span><b>${rec.shown}문항</b></div>
          <div style="--j:3"><span>첫 시도 오답</span><b>${rec.firstWrong}문항</b></div>
          <div style="--j:4"><span>재도전 횟수(재오답 포함)</span><b>${rec.retries}회</b></div>
          <div style="--j:5"><span>확인 코드</span><b>${esc(rec.code)}</b></div>
        </div>
        <div class="clock"><span><i class="dot"></i>현재 시각</span><b id="clk"></b><div class="d" id="cd"></div></div>
      </div>
      <div class="actions">
        <button class="btn line" id="home">홈으로</button>
      </div>
    </div>`;
  const tick = () => { const n = new Date(); document.getElementById('clk').textContent = fmtTime(n); document.getElementById('cd').textContent = fmtDate(n); };
  tick(); clockTimer = setInterval(tick, 1000);
  document.getElementById('home').onclick = home;
  if(typeof window !== 'undefined' && window.scrollTo) window.scrollTo(0, 0);
  const sc = document.getElementById('sc');
  if(sc && !RM && typeof requestAnimationFrame === 'function' && typeof performance !== 'undefined'){
    sc.textContent = '0';
    const st = performance.now(), dur = 1000;
    (function step(t){
      const p = Math.min(1, (t - st) / dur);
      sc.textContent = Math.round(T * (1 - Math.pow(1 - p, 3)));
      if(p < 1) requestAnimationFrame(step);
    })(st);
  }
  if(fresh) celebrate();
}

/* ---------- 시작 ---------- */
(function init(){
  const run = getRun();
  if(run && run.date !== todayKey()){ setRun(null); }
  home();
})();
