<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#16803C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<title>워드프로세서 합격반 · 황정훈 선생님</title>
<style>
/* 블루 & 화이트 테마 */
:root{
  --bg:#EFF5FF; --card:#FFFFFF; --ink:#13233F; --ink2:#5C7292; --line:#D3E1FA;
  --blue:#2F6FED; --onblue:#FFFFFF; --red:#D2453D; --redbg:#FDE7E5; --green:#1C7C54; --greenbg:#DDF2E7;
  --amber:#8A5A00; --amberbg:#FFF3C4; --bubble:#2F6FED; --onbubble:#FFFFFF;
  --mint:#E4EDFF; --lime:#BBD3FF; --deep:#1B4FC4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1626; --card:#17223A; --ink:#E9EEFB; --ink2:#9BABCB; --line:#2C3B5C;
    --blue:#6C9BFF; --onblue:#0B1730; --red:#FF8F87; --redbg:#3A1F1F; --green:#6FD6A4; --greenbg:#173528;
    --amber:#FFD666; --amberbg:#3F3208; --bubble:#6C9BFF; --onbubble:#0B1730;
    --mint:#1B2745; --lime:#33477A; --deep:#3E6FE0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1626; --card:#17223A; --ink:#E9EEFB; --ink2:#9BABCB; --line:#2C3B5C;
  --blue:#6C9BFF; --onblue:#0B1730; --red:#FF8F87; --redbg:#3A1F1F; --green:#6FD6A4; --greenbg:#173528;
  --amber:#FFD666; --amberbg:#3F3208; --bubble:#6C9BFF; --onbubble:#0B1730;
  --mint:#1B2745; --lime:#33477A; --deep:#3E6FE0;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
body{background-image:radial-gradient(var(--line) 1.6px,transparent 1.7px);background-size:24px 24px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 180px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.who{color:var(--blue);background:var(--mint);border:2px solid var(--line);border-radius:99px;padding:2px 12px;font-size:14px;font-weight:800}
h1{font-size:22px;line-height:1.3;margin:12px 0 4px}
h2{font-size:17px;margin:24px 0 8px}
h2::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue);margin-right:8px;vertical-align:1px}
h3{font-size:16px;margin:0}
.sub{margin:0 0 12px;color:var(--ink2);font-size:14px}
.link{background:none;border:0;color:var(--blue);padding:10px 0;min-height:44px;font-size:15px;font-weight:700;cursor:pointer}
.btn{display:block;width:100%;min-height:52px;border:0;border-radius:16px;background:var(--blue);color:var(--onblue);font-weight:800;cursor:pointer;padding:0 16px;box-shadow:0 4px 0 var(--deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--deep)}
.btn.sub2{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sub2:active{box-shadow:0 1px 0 var(--line)}
.btn+.btn{margin-top:12px}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px;box-shadow:0 3px 0 var(--line)}
.card.off{opacity:.55}

/* ---- 첫 화면: 합격반 소개 (선생님 + 남학생/여학생) ---- */
.hero{position:relative;text-align:center;background:linear-gradient(180deg,var(--mint) 0%,var(--card) 100%);border:2px solid var(--line);border-radius:28px;padding:22px 14px 0;overflow:hidden;box-shadow:0 5px 0 var(--line)}
.hero::before{content:"\2726";position:absolute;left:16px;top:14px;color:var(--blue);font-size:20px;opacity:.55}
.hero::after{content:"\2605";position:absolute;right:18px;top:62px;color:var(--lime);font-size:26px;text-shadow:0 0 0 var(--blue)}
.hero .badge{display:inline-block;background:var(--blue);color:var(--onblue);font-size:13px;font-weight:800;padding:3px 12px;border-radius:99px}
.hero .title{margin:8px 0 8px;font-size:32px;line-height:1.2;font-weight:900;color:var(--ink);letter-spacing:-.02em}

.hero .with{display:inline-block;background:var(--card);border:2px dashed var(--blue);color:var(--blue);border-radius:99px;padding:4px 16px;font-weight:800;font-size:15px}
.hero .kids{display:flex;justify-content:center;align-items:flex-end;margin-top:10px}
.hero .kids svg{display:block;width:46%;max-width:170px;height:auto}
.hero .kids svg+svg{margin-left:-4px}
.hero.mini{display:flex;align-items:flex-end;justify-content:space-between;text-align:left;padding:14px 8px 0 16px;margin:6px 0 4px}
.hero.mini::before,.hero.mini::after{display:none}
.hero.mini .ht{padding-bottom:14px}
.hero.mini .title{font-size:22px;line-height:1.25;margin:6px 0 8px}
.hero.mini .with{font-size:13px;padding:2px 12px}
.hero.mini .kids{margin:0;flex-shrink:0}
.hero.mini .kids svg{width:74px}

.login{max-width:380px;margin:3vh auto 0;padding:0 18px}
.login .lcard{background:var(--card);border:2px solid var(--line);border-radius:24px;padding:4px 16px 18px;margin-top:14px;box-shadow:0 4px 0 var(--line)}
.lcard{text-align:center}
.login label{display:block;font-weight:800;font-size:14px;margin:14px 0 4px;text-align:center}
.login input{width:100%;min-height:50px;padding:8px 14px;border:2px solid var(--line);border-radius:16px;background:var(--bg);font-size:18px;text-align:center}
.login input:focus{border-color:var(--blue);outline:none;background:var(--card)}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:1.4em;margin:10px 0 0}
.ex{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ex b{font-size:17px}
.ex small{display:block;color:var(--ink2)}
.ex .btns{display:flex;gap:8px;flex-shrink:0}
.ex .btns .btn{width:auto;min-height:44px;padding:0 16px;margin:0;border-radius:14px}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;gap:6px;background:var(--bg);padding:8px 0}
.tabs button{flex:1;min-height:54px;border:2px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;line-height:1.25;font-size:13px;padding:4px 2px;color:var(--ink2)}
.tabs button b{display:block;font-size:15px;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--blue);color:var(--onblue);border-color:var(--blue);box-shadow:0 3px 0 var(--deep)}
.tabs button[aria-selected=true] b{color:var(--onblue)}
.sect{background:var(--card);border:2px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line)}
.row:nth-child(5n){border-bottom:2px solid var(--blue)}
.row:last-child{border-bottom:0}
.row .n{width:30px;font-weight:800;text-align:right;font-variant-numeric:tabular-nums;color:var(--blue)}
.row .opts{flex:1;display:flex;justify-content:space-around}
.o{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink2);background:transparent;font-size:19px;cursor:pointer;padding:0;line-height:1;transition:transform .08s}
.o:active{transform:scale(.92)}
.o[aria-pressed=true]{background:var(--bubble);color:var(--onbubble);border-color:var(--bubble);box-shadow:0 2px 0 var(--deep)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .cnt{font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap;color:var(--blue)}
.bar .btn{margin:0}
.bar .ask{flex:1;font-size:14px}
.bar .two{display:flex;gap:8px;margin-top:8px}
.bar .two .btn{min-height:44px;margin:0}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.avg{font-size:46px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--blue)}
.avg small{font-size:20px;font-weight:800}
.vd{font-weight:800;padding:2px 14px;border-radius:99px;font-size:14px}
.vd.ok{background:var(--greenbg);color:var(--green)}
.vd.mid{background:var(--amberbg);color:var(--amber)}
.vd.bad{background:var(--redbg);color:var(--red)}
.subj{display:grid;grid-template-columns:1fr 46px;gap:2px 10px;align-items:center;margin-top:12px;font-size:14px}
.subj .tr{grid-column:1/3;height:12px;border-radius:6px;background:var(--mint);overflow:hidden;position:relative;margin-bottom:6px}
.subj .tr i{display:block;height:100%;background:var(--blue);border-radius:6px}
.subj .tr i.f{background:var(--red)}
.subj .tr b{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
.subj .sv{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.headline{font-size:17px;line-height:1.5;margin:0}
.cc{border-left:6px solid var(--red)}
.cc h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cc .c{font-size:13px;font-weight:400;color:var(--ink2);white-space:nowrap}
.cc .qs{margin:6px 0 2px;color:var(--ink2);font-size:14px}
.cc .pg{margin:6px 0 0;font-size:18px;font-weight:800;color:var(--blue)}
.cc .pg.none{font-size:15px;font-weight:700;color:var(--amber)}
.cc ul{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink2)}
.cc .note{margin:6px 0 0;font-size:13px;color:var(--amber)}
.cc .explain{margin:4px 0 0;font-size:14px;line-height:1.6;background:var(--mint);border-radius:12px;padding:10px 12px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{white-space:nowrap;color:var(--blue)}
td.c{text-align:center;white-space:nowrap}
textarea.send{width:100%;min-height:150px;padding:10px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-size:13px;line-height:1.5;resize:vertical}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.hero .kids,.hero .ht,.hero .badge,.hero .title,.hero .with{position:relative;z-index:1}
.hero.mini{flex-wrap:wrap}
.hero.mini .ht{flex:1}

/* 노트 표지 스타일 (스프링 + 두꺼운 외곽선 + 이름표 + 하단 바) */
.hero{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding-top:30px;overflow:visible}
.hero::before,.hero::after{content:none}
.hero.mini{padding-top:14px}
.rings{position:absolute;left:0;right:0;top:-15px;display:flex;justify-content:center;gap:14px;z-index:2;pointer-events:none}
.rings svg{width:26px;height:26px;flex-shrink:0}
.hero.mini .rings{display:none}
.hero .badge{display:none}
.nameplate{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:3px solid var(--ink);border-radius:99px;padding:5px 18px;font-weight:800;font-size:14px;color:var(--ink)}
.title .line2{display:block;color:var(--blue)}
.hero .kids{position:relative;margin-top:10px}
.hero .bandbar{margin:14px -14px 0;background:var(--blue);color:var(--onblue);display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;font-weight:800;font-size:15px;border-top:3px solid var(--ink)}
.hero.mini .with{border:2px solid var(--ink);background:var(--card);color:var(--ink)}
</style>
</head>

],"x":"MBR(Master Boot Record)은 하드디스크의 맨 앞 섹터에 저장된, 부팅 정보와 파티션 구성 정보를 담은 영역이다. 전원을 켜면 POST(전원 인가 자체 검사)로 하드웨어를 점검한 뒤 MBR을 읽어 운영체제를 찾아 적재한다. FAT(파일 할당 테이블)는 파일이 디스크의 어느 위치에 저장되어 있는지 기록하는 표이며, 루트 폴더는 디스크의 최상위 폴더를 뜻한다."},"C44":{"n":"전자우편 프로토콜","s":3,"p":[["36","09 전자우편 사용하기"]]},"C45":{"n":"인터넷 프로토콜(TCP/IP·OSI 계층)","s":3,"p":[["32","TCP/IP 프로토콜 구조"],["S7","14. OSI 7계층 순서 및 계층별 프로토콜"]]},"C46":{"n":"인터넷 프로그래밍 언어","s":3,"p":[["32","인터넷 프로그래밍 언어"],["S6","8. 프로그래밍 언어 분류"]]},"C47":{"n":"최신 컴퓨팅 기술(클라우드·그리드 등)","s":3,"p":[["35","최신 기술의 활용"]]},"C48":{"n":"바이러스 예방","s":3,"p":[["29","바이러스 예방 방법"],["33","악성 프로그램"]]},"C49":{"n":"핀테크·ICT 신기술 용어","s":3,"p":[],"x":"핀테크(FinTech)는 금융(Finance)과 기술(Technology)을 합친 말로, 모바일·빅데이터 등 IT 기술을 활용해 기존 금융과 차별화된 서비스를 제공하는 것을 뜻한다(삼성페이·애플페이·알리페이 등 간편결제가 대표적). 오픈뱅킹은 하나의 앱으로 여러 은행 계좌를 조회·이체하는 서비스, 스마트뱅킹은 스마트폰 앱으로 하는 은행 업무, 펌뱅킹은 기업과 은행 전산망을 직접 연결하는 서비스로 서로 구분된다."},"C50":{"n":"보안 위협(스니핑·스푸핑 등)","s":3,"p":[["33","프로토콜의 취약점 공격"],["34","프로토콜의 취약점 공격(이어서)"]]},"C51":{"n":"멀티미디어(하이퍼텍스트·하이퍼미디어)","s":3,"p":[["29","05 멀티미디어 활용하기"]]},"C52":{"n":"데이터 구성 단위","s":3,"p":[["26","데이터 구성 단위"],["S6","2. 데이터 단위 크기순 정리"]]},"C53":{"n":"운영체제의 분류(처리 방식)","s":3,"p":[["28","운영 체제의 분류"]]},"C54":{"n":"컴퓨터 발전사·단위 순서","s":3,"p":[["26","컴퓨터 역사, 세대별 분류"],["S6","1. 속도 단위 순서"]]},"C55":{"n":"데이터 변환(PCM 등)","s":3,"p":[],"x":"PCM(Pulse Code Modulation, 펄스 부호 변조)은 소리 같은 아날로그 신호를 디지털 신호로 바꾸는 대표적인 방법이다. ①표본화(일정 간격으로 신호값을 추출) → ②양자화(추출한 값을 정해진 단계로 반올림) → ③부호화(0과 1의 이진수로 표현)의 3단계로 이루어진다."},"C56":{"n":"그래픽 파일 형식","s":3,"p":[["30","그래픽/이미지"]]},"C57":{"n":"글꼴 구현 방식(비트맵·벡터·아웃라인)","s":1,"p":[["16","글꼴 구현 방식"],["S1","14. 글꼴 구현 방식 보완 - 포스트스크립트"]]},"C58":{"n":"OLE·책갈피·홈 베이스","s":1,"p":[["S1","12. 책갈피와 홈 베이스"],["S1","13. OLE"]]},"C59":{"n":"파일·폴더 관리(복사·이동·삭제·검색·휴지통)","s":2,"p":[["22","파일과 폴더 관리"],["S4","3. 바로 가기 아이콘의 특성"],["S4","4. 휴지통 속성"]]},"C60":{"n":"Windows 보조 앱(계산기·그림판·메모장 등)","s":2,"p":[["22","메모장"],["23","그림판·캡처 도구·문자표, 계산기, 기타 앱과 도구"]]},"C61":{"n":"시스템 관리 도구(작업 관리자·레지스트리·CMOS·BIOS·안전 모드)","s":2," 눈에 보여주는 기능이다. 데이터 전체를 선택하거나 일부만 블록으로 지정해 만들 수 있고, 2차원·3차원 차트를 지원한다. 원형 차트는 데이터 계열이 1개일 때 비율을 보여주는 용도로 쓰인다."},"C81":{"n":"복사(Copy)와 잘라내기(Cut)","s":1,"p":[],"x":"복사·잘라내기 모두 영역을 먼저 선택한 다음 실행해야 하며, 그 내용은 버퍼(클립보드)에 보관되어 여러 번 붙여넣기 할 수 있다. 차이는 문서 분량에 있다: 복사는 원본이 그대로 남아 문서 분량이 늘어나지만, 잘라내기는 원본이 사라져 문서 분량에 변화가 없다."},"C82":{"n":"페이지 넘김(자동·강제)","s":1,"p":[],"x":"문서 내용이 한 페이지를 다 채우면 커서가 자동으로 다음 페이지 처음으로 넘어가는 것이 자동 페이지 넘김이다. 반대로 페이지가 다 차지 않은 상태에서도 사용자가 강제로 커서를 다음 페이지의 처음으로 옮기는 것이 강제 페이지 넘김(페이지 나누기)이다."},"C83":{"n":"표(테이블) 기능","s":1,"p":[],"x":"표는 만든 뒤에도 서식·크기·테두리를 자유롭게 바꿀 수 있다. 같은 행이나 열에 있는 여러 셀을 하나로 합칠 수 있고(셀 병합), 표 안에 또 다른 표(중첩 표)를 만들어 편집할 수도 있다."},"C68":{"n":"EDI(전자적 데이터교환)","s":1,"p":[["S1","10. EDI(전자적 데이터교환)"]]},"C69":{"n":"Windows 운영체제 특징·세부 설정 일반","s":2,"p":[["21","Windows 11의 특징"],["23","전원·접근성·계정·개인정보"]]},"C70":{"n":"컴퓨터 일반상식(통신·코드·기타 용어)","s":3,"p":[["25","데이터 표현 방식"],["26","가중치·비가중치 코드"]]}},"examCount":10,"examTitles":{"1":"2024년 상시 01","2":"2024년 상시 02","3":"2024년 상시 03","4":"2024년 상시 04","5":"2025년 상시 01","6":"2025년 상시 02","7":"2025년 상시 03","8":"2026년 상시 01","9":"2026년 상시 02","10":"2026년 상시 05"},"roster":[{"id":1,"h":"01kxnkf"},{"id":2,"h":"17gs2hm"},{"id":3,"h":"0jzqj5y"},{"id":4,"h":"0btvp8p"},{"id":5,"h":"0lewsq6"},{"id":6,"h":"1qh66tw"},{"id":7,"h":"1fziyyb"},{"id":8,"h":"01kntfj"},{"id":9,"h":"0l0rc77"}]};</script>
<script>/* 공통 코어: 학생용과 교사용이 같은 코드를 씁니다 (채점, 결과 코드, 분석) */
const WPQ = (function () {
  'use strict';
  const D = DATA;
  const R = D.rule;
  const r1 = function (n) { return Math.round(n * 10) / 10; };
  const fmt = function (n) { return String(r1(n)); };
  const mean = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; };
  const sd = function (a) {
    if (a.length < 2) return 0;
    const m = mean(a);
    return Math.sqrt(mean(a.map(function (v) { return (v - m) * (v - m); })));
  };
  const keyOf = function (s) { return String(s).trim().toLowerCase(); };

  /* ---------- 해시 / 결과 코드 ---------- */
  function fnv(s) {
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h >>> 0;
  }
  function b36(n, len) { return n.toString(36).padStart(len || 0, '0'); }
  function checksum(payload) { return b36(fnv('wpq|' + payload), 7); }
  function pinHash(id, pin) { return b36(fnv('pin|' + id + '|' + pin + '|wpq'), 7); }

  function encode(id, exam, tsMs, answers) {
    const payload = ['WPQ1', id, exam, b36(Math.floor(tsMs / 1000)), answers].join('|');
    return payload + '|' + checksum(payload);
  }
  /* 글 전체에서 결과 코드를 모두 찾는다 (카톡 메시지 통째로 붙여넣기 가능) */
  function scan(text) {
    const re = /WPQ1\|(\d{1,4})\|(\d{1,3})\|([0-9a-z]{4,10})\|([0-4]{60})\|([0-9a-z]{7})/g;
    const items = [];
    let m;
    while ((m = re.exec(text)) !== null) {
      const payload = 'WPQ1|' + m[1] + '|' + m[2] + '|' + m[3] + '|' + m[4];
      items.push({
        code: m[0], sid: +m[1], exam: +m[2], ts: parseInt(m[3], 36) * 1000,
        answers: m[4], valid: checksum(payload) === m[5]
      });
    }
    const total = (String(text).match(/WPQ1\|/g) || []).length;
    return { items: items, broken: Math.max(0, total - items.length) };
  }

  /* ---------- 학습지 쪽수 표시 ---------- */
  function refLabel(r) { return r.charAt(0) === 'S' ? '보충 ' + r.slice(1) + '쪽' : r + '쪽'; }
  function pagesText(info) {
    if (!info || !info.p.length) return '';
    const seen = {}, out = [];
    info.p.forEach(function (x) { if (!seen[x[0]]) { seen[x[0]] = 1; out.push(refLabel(x[0])); } });
    return out.join(', ');
  }
  function qsText(qs, noExam) {
    const g = {};
    qs.forEach(function (x) { (g[x.examNo] = g[x.examNo] || []).push(x.q); });
    return Object.keys(g).sort(function (a, b) { return a - b; }).map(function (no) {
      const list = g[no].sort(function (a, b) { return a - b; }).map(function (q) { return q + '번'; }).join(', ');
      return noExam ? list : no + '회차 ' + list;
    }).join(' / ');
  }

  /* ---------- 채점 ---------- */
  function analyze(examNo, answers) {
    const ex = D.exams[examNo];
    const perQ = [];
    for (let i = 0; i < 60; i++) {
      const a = +answers.charAt(i), k = +ex.key.charAt(i);
      perQ.push({ q: i + 1, ans: a, key: k, ok: a === k, blank: a === 0, concept: ex.map[i], cov: +ex.cov.charAt(i) });
    }
    const subj = D.subjects.map(function (s) {
      let c = 0;
      for (let q = s.from; q <= s.to; q++) if (perQ[q - 1].ok) c++;
      const n = s.to - s.from + 1;
      return { name: s.name, correct: c, total: n, score: Math.round(c / n * 100) };
    });
    const scores = subj.map(function (s) { return s.score; });
    const avg = r1(mean(scores));
    const fails = [];
    scores.forEach(function (s, i) { if (s < R.passMin) fails.push(i); });
    return {
      examNo: examNo, title: ex.title, perQ: perQ, subj: subj, scores: scores, avg: avg, fails: fails,
      pass: avg >= R.passAvg && fails.length === 0,
      wrongCount: perQ.filter(function (p) { return !p.ok; }).length,
      blankCount: perQ.filter(function (p) { return p.blank; }).length
    };
  }

  /* 오답이 많은 개념 순위 (여러 회차 합산 가능) */
  function conceptRank(list) {
    const m = {};
    list.forEach(function (it) {
      it.perQ.forEach(function (p) {
        const c = m[p.concept] = m[p.concept] || { id: p.concept, total: 0, wrong: 0, qs: [] };
        c.total++;
        if (!p.ok) { c.wrong++; c.qs.push({ examNo: it.examNo, q: p.q, ans: p.ans, key: p.key, cov: p.cov }); }
      });
    });
    return Object.keys(m).map(function (k) { return m[k]; })
      .filter(function (c) { return c.wrong > 0; })
      .sort(function (a, b) { return b.wrong - a.wrong || (b.wrong / b.total) - (a.wrong / a.total) || a.id.localeCompare(b.id); })
      .map(function (c) { c.info = D.concepts[c.id]; return c; });
  }

  /* ---------- 학생용 피드백 (한 번 푼 결과) ---------- */
  function verdictOf(a) {
    if (a.fails.length) return { cls: 'bad', label: '과락 있음' };
    if (a.pass) return { cls: 'ok', label: '합격권' };
    return { cls: 'mid', label: '합격선 미달' };
  }
  function studentFeedback(a) {
    const rank = conceptRank([{ examNo: a.examNo, perQ: a.perQ }]);
    let headline;
    if (a.wrongCount === 0) headline = '만점이에요. 아주 잘했어요!';
    else if (a.fails.length) {
      headline = a.fails.map(function (i) { return D.subjects[i].name + ' ' + a.scores[i] + '점'; }).join(', ') +
        '이(가) 과락선(' + R.passMin + '점) 아래예요. 이 과목의 개념부터 먼저 잡아 보세요.';
    } else if (a.pass) {
      const m = r1(a.avg - R.passAvg);
      headline = m < 5
        ? '평균 ' + fmt(a.avg) + '점으로 합격선을 넘었지만 여유가 ' + fmt(m) + '점뿐이에요.'
        : '평균 ' + fmt(a.avg) + '점으로 합격선보다 ' + fmt(m) + '점 위예요.';
    } else {
      headline = '평균 ' + fmt(a.avg) + '점, 합격선(' + R.passAvg + '점)까지 ' + fmt(R.passAvg - a.avg) + '점 남았어요.';
    }
    return { headline: headline, top: rank.slice(0, 3), more: Math.max(0, rank.length - 3), all: rank };
  }
  function shareText(id, a, ts, code) {
    const fb = studentFeedback(a);
    const v = verdictOf(a).label;
    const lines = [
      '[워드프로세서 기출 결과]',
      id + '번 / ' + a.examNo + '회차 (' + a.title + ')',
      a.subj.map(function (s, i) { return (i + 1) + '과목 ' + s.score + '점'; }).join(', ') + ' → 평균 ' + fmt(a.avg) + '점 (' + v + ')'
    ];
    if (fb.top.length) {
      lines.push('먼저 볼 개념: ' + fb.top.map(function (c) {
        const p = pagesText(c.info);
        return c.info.n + (p ? '(' + p + ')' : '');
      }).join(', '));
    }
    lines.push('', '아래 코드는 지우지 말고 그대로 보내 주세요.', code);
    return lines.join('\n');
  }

  /* ---------- 교사용: 학생별 모델 ---------- */
  function expectedScore(list) {
    if (list.length < 3) return { n: list.length, need: 3 - list.length, ok: false };
    const use = list.slice(-5);
    const avgs = use.map(function (x) { return x.avg; });
    const c = mean(avgs), band = Math.max(4, Math.round(sd(avgs)));
    const low = Math.max(0, Math.round(c - band)), high = Math.min(100, Math.round(c + band));
    const subj = D.subjects.map(function (s, i) {
      const v = use.map(function (x) { return x.scores[i]; });
      const m = mean(v), b = Math.max(5, Math.round(sd(v)));
      const lo = Math.max(0, Math.round(m - b));
      return { name: s.name, center: Math.round(m), low: lo, high: Math.min(100, Math.round(m + b)),
        risk: lo >= 50 ? '낮음' : lo >= R.passMin ? '주의' : '위험' };
    });
    const anyRisk = subj.some(function (s) { return s.risk === '위험'; });
    let verdict;
    if (low >= R.passAvg && !anyRisk) verdict = '합격 가능성 높음';
    else if (high < R.passAvg) verdict = '합격선 미달 예상';
    else verdict = '합격선 경계';
    return { ok: true, n: use.length, center: Math.round(c), low: low, high: high, subj: subj, verdict: verdict, anyRisk: anyRisk };
  }

  function secondRound(exams) {
    const multi = exams.filter(function (e) { return e.rounds.length >= 2; });
    if (!multi.length) return null;
    const persist = [], fixed = [], regress = [];
    multi.forEach(function (e) {
      const f = e.rounds[0].res.perQ, l = e.rounds[e.rounds.length - 1].res.perQ;
      for (let i = 0; i < 60; i++) {
        const pf = f[i], pl = l[i];
        const rec = { examNo: e.examNo, q: pf.q, concept: pf.concept, first: pf.ans, last: pl.ans, key: pf.key, cov: pf.cov };
        if (!pf.ok && !pl.ok) { rec.same = pf.ans === pl.ans && pf.ans !== 0; persist.push(rec); }
        else if (!pf.ok && pl.ok) fixed.push(rec);
        else if (pf.ok && !pl.ok) regress.push(rec);
      }
    });
    const g = {};
    persist.forEach(function (x) {
      const c = g[x.concept] = g[x.concept] || { id: x.concept, info: D.concepts[x.concept], qs: [], sameCount: 0 };
      c.qs.push(x);
      if (x.same) c.sameCount++;
    });
    const persistConcepts = Object.keys(g).map(function (k) { return g[k]; })
      .sort(function (a, b) { return b.qs.length - a.qs.length || b.sameCount - a.sameCount || a.id.localeCompare(b.id); });
    return {
      multi: multi.map(function (e) {
        const f = e.rounds[0].res, l = e.rounds[e.rounds.length - 1].res;
        return { examNo: e.examNo, title: e.title, rounds: e.rounds.length, firstAvg: f.avg, lastAvg: l.avg, firstWrong: f.wrongCount, lastWrong: l.wrongCount };
      }),
      persist: persist, fixed: fixed, regress: regress, persistConcepts: persistConcepts
    };
  }

  /* attempts: [{code,sid,exam,ts,answers}] */
  function buildModel(sid, attempts, examNos) {
    const mine = attempts.filter(function (a) {
      return a.sid === sid && D.exams[a.exam] && (!examNos || examNos.indexOf(a.exam) >= 0);
    }).sort(function (a, b) { return a.ts - b.ts; });
    const by = {};
    mine.forEach(function (a) { (by[a.exam] = by[a.exam] || []).push(a); });
    const exams = Object.keys(by).map(Number).sort(function (a, b) { return a - b; }).map(function (no) {
      return {
        examNo: no, title: D.exams[no].title,
        rounds: by[no].map(function (a, i) { return { k: i + 1, ts: a.ts, code: a.code, res: analyze(no, a.answers) }; })
      };
    });
    const weak = conceptRank(exams.map(function (e) { return { examNo: e.examNo, perQ: e.rounds[0].res.perQ }; }));
    const expected = expectedScore(exams.map(function (e) {
      const r = e.rounds[0].res; return { examNo: e.examNo, avg: r.avg, scores: r.scores };
    }));
    return { sid: sid, exams: exams, weak: weak, expected: expected, second: secondRound(exams) };
  }

  function reportParts(m, name) {
    const P = { name: name, has: m.exams.length > 0, m: m };
    if (!P.has) return P;
    const firsts = m.exams.map(function (e) { return e.rounds[0].res; });
    const avgs = firsts.map(function (r) { return r.avg; });
    P.firstSummary = '처음 푼 ' + firsts.length + '개 회차의 평균은 ' + fmt(mean(avgs)) + '점이에요.' +
      (firsts.length > 1 ? ' (최고 ' + fmt(Math.max.apply(null, avgs)) + '점, 최저 ' + fmt(Math.min.apply(null, avgs)) + '점)' : '');
    P.weak = m.weak.slice(0, 5);
    if (m.second) {
      const s = m.second;
      const sameN = s.persist.filter(function (x) { return x.same; }).length;
      let h = '2바퀴 기록이 있는 ' + s.multi.length + '개 회차에서 ' + s.fixed.length + '문항을 고쳤어요.';
      if (s.persist.length) h += ' 다만 ' + s.persist.length + '문항은 저번에도 틀렸는데 또 틀렸어요.';
      else h += ' 저번에 틀린 문항은 모두 고쳤어요.';
      if (s.regress.length) h += ' 이번에 새로 틀린 문항도 ' + s.regress.length + '개 있어요.';
      P.secondHeadline = h;
      P.sameN = sameN;
    }
    const planSrc = (m.second && m.second.persistConcepts.length) ? m.second.persistConcepts : m.weak;
    P.plan = planSrc.slice(0, 3);
    return P;
  }

  function reportPlain(P, dateStr) {
    if (!P.has) return P.name + ' 학생은 아직 제출한 기록이 없어요.';
    const m = P.m, L = [];
    L.push('[' + P.name + ' 학생 워드프로세서 학습 피드백] ' + dateStr, '');
    L.push('■ 점수 (처음 푼 기록)');
    m.exams.forEach(function (e) {
      const f = e.rounds[0].res, last = e.rounds[e.rounds.length - 1].res;
      let t = e.examNo + '회차 ' + f.subj.map(function (s) { return s.score; }).join('/') + ' → 평균 ' + fmt(f.avg) + '점 (' + verdictOf(f).label + ')';
      if (e.rounds.length > 1) t += ' / 2바퀴 평균 ' + fmt(last.avg) + '점 (' + (last.avg - f.avg >= 0 ? '+' : '') + fmt(last.avg - f.avg) + ')';
      L.push(t);
    });
    L.push('', '■ 실전 예상 점수');
    if (m.expected.ok) L.push(m.expected.low + '~' + m.expected.high + '점 → ' + m.expected.verdict + (m.expected.anyRisk ? ' (과락 주의 과목 있음)' : ''));
    else L.push('처음 푼 기록이 3회차 이상 쌓이면 알려 줄게요. (지금 ' + m.expected.n + '회차)');
    L.push('', '■ 부족한 개념');
    P.weak.forEach(function (c, i) {
      const p = pagesText(c.info);
      L.push((i + 1) + '. ' + c.info.n + ' - ' + qsText(c.qs) + (p ? ' / 학습지 ' + p : ' / 학습지에 없는 내용(선생님께 질문)'));
    });
    if (m.second) {
      L.push('', '■ 2바퀴 분석', P.secondHeadline);
      m.second.persistConcepts.slice(0, 5).forEach(function (c) {
        const p = pagesText(c.info);
        L.push('- 저번에도 틀렸는데 또 틀림: ' + c.info.n + ' (' + qsText(c.qs) + ')' + (c.sameCount ? ' - 지난번과 같은 보기를 골랐어요' : '') + (p ? ' / 학습지 ' + p : ''));
      });
    }
    L.push('', '■ 이번 주 공부 순서');
    P.plan.forEach(function (c, i) {
      const p = pagesText(c.info);
      L.push((i + 1) + '. ' + c.info.n + (p ? ' → 학습지 ' + p : ' → 선생님께 질문'));
    });
    return L.join('\n');
  }

  return {
    D: D, r1: r1, fmt: fmt, mean: mean, keyOf: keyOf,
    pinHash: pinHash, checksum: checksum, encode: encode, scan: scan,
    refLabel: refLabel, pagesText: pagesText, qsText: qsText,
    analyze: analyze, conceptRank: conceptRank, verdictOf: verdictOf, studentFeedback: studentFeedback, shareText: shareText,
    expectedScore: expectedScore, secondRound: secondRound, buildModel: buildModel, reportParts: reportParts, reportPlain: reportPlain
  };
})();
</script>
<script>
'use strict';
const S = { view: 'login', user: null, examNo: null, ans: [], tab: 0, res: null, blankAsk: false };
const $ = function (id) { return document.getElementById(id); };

const KID_GIRL =

  '<circle cx="25" cy="66" r="7" fill="#FFD9B8" stroke="#13233F" stroke-width="3"/><circle cx="95" cy="66" r="7" fill="#FFD9B8" stroke="#13233F" stroke-width="3"/>' +
  '<circle cx="60" cy="62" r="35" fill="#FFE3C8" stroke="#13233F" stroke-width="3.5"/>' +
  '<path d="M23 60 C18 24 44 14 62 16 C84 16 102 30 97 60 C92 42 78 32 60 34 C44 36 30 46 23 60Z" fill="#3A281F" stroke="#13233F" stroke-width="3" stroke-linejoin="round"/>' +
  '<circle cx="45" cy="69" r="4.5" fill="#1E1B18"/><circle cx="75" cy="69" r="4.5" fill="#1E1B18"/>' +
  '<ellipse cx="35" cy="80" rx="6.5" ry="4.5" fill="#FF9FA0" opacity=".75"/><ellipse cx="85" cy="80" rx="6.5" ry="4.5" fill="#FF9FA0" opacity=".75"/>' +
  '<path d="M50 81 Q60 90 70 81" fill="none" stroke="#13233F" stroke-width="3" stroke-linecap="round"/>' +
  '</svg>';
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
let toastTimer = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

/* ---------- 저장 (이 기기에만 있는 임시 저장) ---------- */
function draftKey(n) { return 'wpq_draft_' + S.user.id + '_' + n; }
function resKey() { return 'wpq_res_' + S.user.id; }
function loadDraft(n) { const v = lsGet(draftKey(n)); return v && /^[0-4]{60}$/.test(v) ? v : null; }
function loadSaved() { try { return JSON.parse(lsGet(resKey()) || '{}') || {}; } catch (e) { return {}; } }
function saveResult(n, ts, answers) { const m = loadSaved(); m[n] = { ts: ts, ans: answers }; lsSet(resKey(), JSON.stringify(m)); }

/* ---------- 화면 전환 ---------- */
function go(v) { S.view = v; render(); window.scrollTo(0, 0); }
function render() { ({ login: vLogin, home: vHome, input: vInput, result: vResult })[S.view](); }

/* ---------- 로그인 ---------- */
function vLogin(msg) {
  $('app').innerHTML =
    '<form class="login" id="lf"><div class="hero"><div class="rings">' + RINGS + '</div>' +
    '<span class="nameplate">방과후 자격증반</span>' +
    '<div class="title">워드프로세서<br><span class="line2">합격반</span></div>' +
    '<div class="kids">' + KID_BOY + KID_GIRL + '</div>' +
    '<div class="bandbar">황정훈 선생님과 함께해요</div></div>' +
    '<div class="lcard"><p class="sub" style="margin-top:14px">번호와 비밀번호 입력해주세요.</p>' +
    '<label for="uid">번호</label><input id="uid" inputmode="numeric" autocomplete="username" maxlength="3">' +
    '<label for="upw">비밀번호 (숫자 4자리)</label><input id="upw" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8">' +
    '<button class="btn" type="submit" style="margin-top:20px">들어가기</button><p class="err" id="err">' + esc(msg || '') + '</p></div></form>';
}
function doLogin() {
  const id = parseInt($('uid').value, 10), pin = $('upw').value.trim();
  const u = DATA.roster.filter(function (r) { return r.id === id; })[0];
  if (!u || WPQ.pinHash(id, pin) !== u.h) { $('err').textContent = '번호 또는 비밀번호가 맞지 않아요.'; return; }
  S.user = { id: id };
  go('home');
}
function logout() { S.user = null; S.res = null; go('login'); }

/* ---------- 처음 화면: 회차 목록 ---------- */
function vHome() {
  const saved = loadSaved();
  let h = '<div class="wrap"><div class="top"><span class="who">' + S.user.id + '번 학생</span><button class="link" data-a="logout">로그아웃</button></div>' +
    '<div class="hero mini"><div class="ht"><span class="nameplate">방과후 자격증반</span>' +
    '<div class="title">워드프로세서<br><span class="line2">합격반</span></div><div class="with">황정훈 선생님과 함께해요</div></div>' +
    '<div class="kids">' + KID_BOY + KID_GIRL + '</div></div>' +
    '<h1>어느 회차를 풀었나요?</h1><p class="sub">시험지를 풀고 고른 답을 입력하면 바로 채점해 줘요.</p>';
  for (let n = 1; n <= DATA.examCount; n++) {
    const ex = DATA.exams[n];
    if (!ex) {
      const t = (DATA.examTitles && DATA.examTitles[n]) ? esc(DATA.examTitles[n]) + ' · 준비 중이에요' : '준비 중이에요';
      h += '<div class="card off"><div class="ex"><div><b>' + n + '회차</b><small>' + t + '</small></div></div></div>';
      continue;
    }
    const hasDraft = !!loadDraft(n);
    h += '<div class="card"><div class="ex"><div><b>' + n + '회차</b><small>' + esc(ex.title) + '</small></div><div class="btns">' +
      (saved[n] ? '<button class="btn sub2" data-a="view" data-n="' + n + '">지난 결과</button>' : '') +
      '<button class="btn" data-a="start" data-n="' + n + '">' + (hasDraft ? '이어서 입력' : '풀기') + '</button></div></div></div>';
  }
  $('app').innerHTML = h + '</div>';
}

/* ---------- 답안 입력 ---------- */
function startExam(n, fresh) {
  S.examNo = n; S.tab = 0; S.blankAsk = false;
  const d = fresh ? null : loadDraft(n);
  S.ans = d ? d.split('').map(Number) : new Array(60).fill(0);
  go('input');
}
function vInput() {
  const ex = DATA.exams[S.examNo];
  let rows = '';
  DATA.subjects.forEach(function (s, si) {
    rows += '<div class="sect" data-s="' + si + '">';
    for (let q = s.from; q <= s.to; q++) {
      rows += '<div class="row"><span class="n">' + q + '</span><div class="opts">';
      for (let o = 1; o <= 4; o++) {
        rows += '<button type="button" class="o" data-a="pick" data-q="' + q + '" data-o="' + o + '" aria-pressed="false" aria-label="' + q + '번 문제 ' + o + '번">' + CIRC.charAt(o - 1) + '</button>';
      }
      rows += '</div></div>';
    }
    rows += '</div>';
  });
  $('app').innerHTML =
    '<div class="wrap"><div class="top"><button class="link" data-a="home">← 처음으로</button><span class="who">' + S.user.id + '번 학생</span></div>' +
    '<h1>' + S.examNo + '회차 답안 입력</h1><p class="sub">' + esc(ex.title) + '. 시험지에서 고른 번호를 눌러요. 다시 누르면 지워져요.</p>' +
    '<div class="tabs" role="tablist" id="tabs"></div>' + rows + '</div><div class="bar" id="bar"></div>';
  paint();
}
function filled(from, to) { let c = 0; for (let q = from; q <= to; q++) if (S.ans[q - 1]) c++; return c; }
function paint() {
  document.querySelectorAll('.sect').forEach(function (el) { el.hidden = (+el.dataset.s !== S.tab); });
  document.querySelectorAll('.o').forEach(function (b) {
    const on = S.ans[+b.dataset.q - 1] === +b.dataset.o;
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  $('tabs').innerHTML = DATA.subjects.map(function (s, si) {
    const n = s.to - s.from + 1, f = filled(s.from, s.to);
    return '<button role="tab" data-a="tab" data-t="' + si + '" aria-selected="' + (S.tab === si) + '"><b>' + (si + 1) + '과목</b>' + s.from + '~' + s.to + '번 (' + f + '/' + n + ')</button>';
  }).join('');
  paintBar();
}
function paintBar() {
  const total = filled(1, 60), blanks = 60 - total;
  if (S.blankAsk) {
    $('bar').innerHTML = '<div class="in"><div class="ask">빈 문항이 ' + blanks + '개 있어요. 그대로 채점할까요? (빈 문항은 틀린 것으로 계산돼요)</div></div>' +
      '<div class="two" style="max-width:520px;margin:8px auto 0"><button class="btn sub2" data-a="keep">계속 입력</button><button class="btn" data-a="gradeNow">그대로 채점</button></div>';
  } else {
    $('bar').innerHTML = '<div class="in"><span class="cnt">입력 ' + total + '/60</span><button class="btn" data-a="grade">채점하기</button></div>';
  }
}
function pick(q, o) {
  S.ans[q - 1] = S.ans[q - 1] === o ? 0 : o;
  S.blankAsk = false;
  lsSet(draftKey(S.examNo), S.ans.join(''));
  paint();
}
function grade(force) {
  const blanks = S.ans.filter(function (v) { return v === 0; }).length;
  if (blanks > 0 && !force) { S.blankAsk = true; paintBar(); return; }
  const answers = S.ans.join(''), ts = Date.now();
  saveResult(S.examNo, ts, answers);
  lsDel(draftKey(S.examNo));
  openResult(S.examNo, ts, answers);
}

/* ---------- 결과 ---------- */
function openResult(n, ts, answers) {
  const a = WPQ.analyze(n, answers);
  const code = WPQ.encode(S.user.id, n, ts, answers);
  S.res = { examNo: n, ts: ts, answers: answers, a: a, fb: WPQ.studentFeedback(a), code: code, text: WPQ.shareText(S.user.id, a, ts, code) };
  go('result');
}
function vResult() {
  const R = S.res, a = R.a, fb = R.fb, v = WPQ.verdictOf(a);
  let h = '<div class="wrap"><div class="top"><button class="link" data-a="home">← 처음으로</button><span class="who">' + S.user.id + '번 학생</span></div>' +
    '<h1>' + a.examNo + '회차 채점 결과</h1><p class="sub">' + esc(a.title) + '</p>' +
    '<div class="card"><div class="score"><div class="avg">' + WPQ.fmt(a.avg) + '<small>점</small></div><span class="vd ' + v.cls + '">' + v.label + '</span></div><div class="subj">';
  a.subj.forEach(function (s, i) {
    h += '<span>' + (i + 1) + '과목 ' + esc(s.name) + ' (' + s.correct + '/' + s.total + ')</span><span class="sv">' + s.score + '점</span>' +
      '<div class="tr"><i class="' + (s.score < DATA.rule.passMin ? 'f' : '') + '" style="width:' + s.score + '%"></i><b style="left:' + DATA.rule.passMin + '%"></b></div>';
  });
  h += '</div></div><div class="card"><p class="headline">' + esc(fb.headline) + '</p></div>';

  if (fb.top.length) {
    h += '<h2>먼저 공부할 개념</h2>';
    fb.top.forEach(function (c) {
      const pg = WPQ.pagesText(c.info), none = !c.info.p.length;
      const noCov = c.qs.filter(function (x) { return x.cov === 0; });
      h += '<article class="card cc"><h3>' + esc(c.info.n) + '<span class="c">' + c.wrong + '문항 오답</span></h3>' +
        '<p class="qs">틀린 문항: ' + esc(WPQ.qsText(c.qs, true)) + '</p>' +
        (none
          ? (c.info.x ? '<p class="pg none">학습지에는 없지만 알려드릴게요</p><p class="explain">' + esc(c.info.x) + '</p>'
                      : '<p class="pg none">학습지에 이 내용이 없어요. 선생님께 질문하세요.</p>')
          : '<p class="pg">학습지 ' + esc(pg) + '</p><ul>' + c.info.p.map(function (x) { return '<li>' + esc(WPQ.refLabel(x[0])) + ': ' + esc(x[1]) + '</li>'; }).join('') + '</ul>') +
        (!none && noCov.length ? '<p class="note">※ ' + esc(noCov.map(function (x) { return x.q + '번'; }).join(', ')) + '은(는) 학습지에 설명이 없어요. 선생님께 질문하세요.</p>' : '') +
        '</article>';
    });
    if (fb.more) h += '<p class="sub">이 밖에도 틀린 개념이 ' + fb.more + '개 더 있어요. 아래 틀린 문항 목록에서 확인해요.</p>';
  }

  const wrong = a.perQ.filter(function (p) { return !p.ok; });
  if (wrong.length) {
    h += '<details class="card"><summary>틀린 문항 ' + wrong.length + '개 보기</summary><table><thead><tr><th>번호</th><th>내 답</th><th>정답</th><th>개념</th></tr></thead><tbody>' +
      wrong.map(function (p) {
        return '<tr><td class="c">' + p.q + '</td><td class="c">' + (p.blank ? '미응답' : CIRC.charAt(p.ans - 1)) + '</td><td class="c">' + CIRC.charAt(p.key - 1) + '</td><td>' + esc(DATA.concepts[p.concept].n) + '</td></tr>';
      }).join('') + '</tbody></table></details>';
  }

  h += '<h2>선생님께 결과 보내기</h2><p class="sub">아래 버튼을 누르고, 카카오톡에서 선생님 채팅방을 골라 보내요. 맨 아래 코드는 지우지 마세요.</p>' +
    '<button class="btn" data-a="share">카카오톡으로 보내기</button><button class="btn sub2" data-a="copy">내용 복사하기</button>' +
    '<p class="sub" style="margin-top:12px">보낼 내용</p><textarea class="send" id="sendText" readonly>' + esc(R.text) + '</textarea>' +
    '<button class="btn sub2" data-a="again" style="margin-top:14px">같은 회차 다시 풀기</button></div>';
  $('app').innerHTML = h;
}
async function doShare() {
  const text = S.res.text;
  if (navigator.share) {
    try { await navigator.share({ text: text }); toast('공유창이 열렸어요. 선생님 채팅방을 골라 보내요'); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  await doCopy(true);
}
async function doCopy(fromShare) {
  let ok = false;
  try { if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(S.res.text); ok = true; } } catch (e) {}
  if (!ok) { const ta = $('sendText'); if (ta) { ta.focus(); ta.select(); try { ok = document.execCommand('copy'); } catch (e) {} } }
  toast(ok ? (fromShare === true ? '복사했어요. 카카오톡에 붙여넣어 보내요' : '복사했어요') : '복사가 안 돼요. 아래 내용을 길게 눌러 직접 복사해요');
}
function showSaved(n) {
  const m = loadSaved()[n];
  if (m) openResult(n, m.ts, m.ans);
}

/* ---------- 이벤트 ---------- */
const ACT = {
  logout: logout,
  home: function () { go('home'); },
  start: function (el) { startExam(+el.dataset.n, false); },
  view: function (el) { showSaved(+el.dataset.n); },
  tab: function (el) { S.tab = +el.dataset.t; paint(); window.scrollTo(0, 0); },
  pick: function (el) { pick(+el.dataset.q, +el.dataset.o); },
  grade: function () { grade(false); },
  gradeNow: function () { grade(true); },
  keep: function () { S.blankAsk = false; paintBar(); },
  share: doShare,
  copy: doCopy,
  again: function () { startExam(S.res.examNo, true); }
};
document.addEventListener('click', function (e) {
  const el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (el && ACT[el.dataset.a]) ACT[el.dataset.a](el);
});
document.addEventListener('submit', function (e) {
  if (e.target && e.target.id === 'lf') { e.preventDefault(); doLogin(); }
});
vLogin();
</script>
